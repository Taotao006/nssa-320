---
- name: Play 1 - Rocky Hosts
  hosts: rocky_hosts
  tasks:
    - name: Install Web Server
      ansible.builtin.dnf:
        name: {{ service_name }}
        state: present
    - name: Start and Enable Web Server
      ansible.builtin.service:
        name: {{ service_name }}
        state: started
        enabled: true
    - name: Move index.js to Remote Server
      ansible.builtin.template:
        src: templates/index.js
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

- name: Play 2 - ubuntu Hosts
  hosts: ubuntu_hosts
  tasks:
    - name: Install Web Server
      ansible.builtin.apt:
        name: {{ service_name }}
        state: present
    - name: Start and Enable Web Server
      ansible.builtin.service:
        name: {{ service_name }}
        state: started
        enabled: true
    - name: Move index.js to Remote Server
      ansible.builtin.template:
        src: templates/index.js
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

