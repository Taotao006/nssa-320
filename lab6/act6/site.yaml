---
- name: Play 1 - Rocky Hosts
  hosts: rocky_hosts
  tasks:
    - name: Install Web Server
      ansible.builtin.dnf:
        name: "{{ service_name }}"
        state: present
    - name: Start and Enable Web Server
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: started
        enabled: true
    - name: Move index.j2 to Remote Server
      ansible.builtin.template:
        src: templates/index.j2
        dest: /var/www/html/index.html
        owner: apache
        group: apache
        mode: '0644'
      notify: Restart Web Server

  handlers:
    - name: Restart Web Server
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: restarted

- name: Play 2 - ubuntu Hosts
  hosts: ubuntu_hosts
  tasks:
    - name: Install Web Server
      ansible.builtin.apt:
        name: "{{ service_name }}"
        state: present
    - name: Start and Enable Web Server
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: started
        enabled: true
    - name: Move index.j2 to Remote Server
      ansible.builtin.template:
        src: templates/index.j2
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      notify: Restart Web Server

  handlers:
    - name: Restart Web Server
      ansible.builtin.service:
        name: "{{ service_name }}"
        state: restarted
